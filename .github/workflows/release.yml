name: Release

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: cmalec/tidbyt-monarch

jobs:
  # Nothing is published until the offline suite passes: this workflow pushes
  # :latest on every commit and Unraid pulls that automatically.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fonts the renderer needs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Self test (currency, layout, colours, parsers, cache, config)
        run: python -m tools.selftest

      - name: Scheduler test (push-on-change, alerts, error isolation)
        run: python -m tools.cycle_test

      - name: Push client smoke test
        run: python -m tools.smoke

      - name: Render every view to prove the frames build
        run: python -m tools.preview /tmp/preview

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
